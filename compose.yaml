services:
  php:
    # noinspection ComposeUnknownValues
    image: ghcr.io/phpyh/php:${PHP_IMAGE_VERSION:?Make sure `PHP_IMAGE_VERSION` is declared in `.env`}
    user: ${CONTAINER_USER:-}
    environment:
      INSIDE_DEVCONTAINER: true
      HISTFILE: /workspace/var/.docker_history
      COMPOSER_CACHE_DIR: /workspace/var/.composer_cache
    tty: true
    init: true
    volumes:
      - .:/workspace:cached
    working_dir: /workspace

  kafka-1:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-2:
    image: apache/kafka:3.9.0
    ports:
      - "9093:9092"
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-3:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9092"
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-ui:
    image: provectuslabs/kafka-ui
    ports:
      - "8080:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  zookeeper-apiversions-legacy:
    image: confluentinc/cp-zookeeper:5.3.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-apiversions-legacy:
    image: confluentinc/cp-kafka:5.3.4
    depends_on:
      - zookeeper-apiversions-legacy
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-apiversions-legacy:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-apiversions-legacy:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-plain-standalone:
    image: apache/kafka:3.9.0
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@kafka-plain-standalone:9093
        controller.listener.names=CONTROLLER
        listeners=SASL_PLAINTEXT://:9092,CONTROLLER://:9093
        advertised.listeners=SASL_PLAINTEXT://kafka-plain-standalone:9092
        listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=SASL_PLAINTEXT
        sasl.enabled.mechanisms=PLAIN
        sasl.mechanism.inter.broker.protocol=PLAIN
        listener.name.sasl_plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_broker="broker-secret" user_test="test-secret";
        num.partitions=1
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/tmp/kraft-combined-logs
        EOF
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id cGxhaW4tc3RhbmRhbG9uZS0wMQ --config /tmp/server.properties
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties

  kafka-scram-256-standalone:
    image: apache/kafka:3.9.0
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@kafka-scram-256-standalone:9093
        controller.listener.names=CONTROLLER
        listeners=SASL_PLAINTEXT://:9092,CONTROLLER://:9093
        advertised.listeners=SASL_PLAINTEXT://kafka-scram-256-standalone:9092
        listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=SASL_PLAINTEXT
        sasl.enabled.mechanisms=SCRAM-SHA-256
        sasl.mechanism.inter.broker.protocol=SCRAM-SHA-256
        listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="broker-secret";
        num.partitions=1
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/tmp/kraft-combined-logs
        EOF
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id c2NyYW0tMjU2LXN0YW5kLTAx --config /tmp/server.properties \
            --add-scram 'SCRAM-SHA-256=[name=broker,password=broker-secret]' \
            --add-scram 'SCRAM-SHA-256=[name=test,password=test-secret]'
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties

  kafka-scram-512-standalone:
    image: apache/kafka:3.9.0
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@kafka-scram-512-standalone:9093
        controller.listener.names=CONTROLLER
        listeners=SASL_PLAINTEXT://:9092,CONTROLLER://:9093
        advertised.listeners=SASL_PLAINTEXT://kafka-scram-512-standalone:9092
        listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=SASL_PLAINTEXT
        sasl.enabled.mechanisms=SCRAM-SHA-512
        sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
        listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="broker-secret";
        num.partitions=1
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/tmp/kraft-combined-logs
        EOF
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id c2NyYW0tNTEyLXN0YW5kLTAx --config /tmp/server.properties \
            --add-scram 'SCRAM-SHA-512=[name=broker,password=broker-secret]' \
            --add-scram 'SCRAM-SHA-512=[name=test,password=test-secret]'
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
